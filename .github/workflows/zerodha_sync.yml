name: Daily Zerodha Token Sync

on:
  schedule:
    # Runs at 2:30 AM UTC every day (which is exactly 8:00 AM IST)
    - cron: '30 2 * * *'
  workflow_dispatch: # This adds a "Run Now" button in GitHub so you can test it manually!

jobs:
  vacuum-and-sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python Engine
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Data Libraries
        run: pip install pandas pymysql sqlalchemy

      - name: Run Token Vacuum
        env:
          # Pulls your secure credentials from GitHub Secrets
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: python sync_tokens.py
