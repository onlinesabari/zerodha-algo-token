name: Daily Zerodha Token Sync

on:
  schedule:
    # Runs at 2:30 AM UTC every day (which is exactly 8:00 AM IST)
    - cron: '30 2 * * *'
  workflow_dispatch: # This adds a "Run Now" button in GitHub so you can test it manually!

jobs:
  vacuum-and-sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python Engine
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Data Libraries
        # Swapped database drivers for 'requests'
        run: pip install pandas requests

      - name: Run Token Vacuum
        env:
          # Pulls your secure API credentials from GitHub Secrets
          API_URL: ${{ secrets.API_URL }}
          API_KEY: ${{ secrets.API_KEY }}
        run: python sync_tokens.py
